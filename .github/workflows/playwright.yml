name: Playwright

on:
  push:
    branches: ["main", "master"]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright Suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_ARTIFACTS_DIR: /tmp/portfolio-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser compatibility tests
        id: compatibility
        continue-on-error: true
        env:
          PLAYWRIGHT_ARTIFACTS_DIR: /tmp/portfolio-playwright/compatibility
        run: pnpm --filter web test:e2e navigation.test.ts contact-form.test.ts browser-compatibility.test.ts

      - name: Run Chromium project, visual, smoke, and performance tests
        id: chromium
        continue-on-error: true
        env:
          PLAYWRIGHT_ARTIFACTS_DIR: /tmp/portfolio-playwright/chromium
        run: pnpm --filter web test:e2e --project=chromium projects.test.ts route-smoke.test.ts visual-regression.test.ts homepage-performance.test.ts

      - name: Upload Playwright Report
        if: ${{ steps.compatibility.outcome == 'failure' || steps.chromium.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: /tmp/portfolio-playwright
          if-no-files-found: ignore

      - name: Fail if any Playwright suite failed
        if: ${{ steps.compatibility.outcome == 'failure' || steps.chromium.outcome == 'failure' }}
        run: exit 1
